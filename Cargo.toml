[package]
name = "unravel"
version = "0.6.0-rc1-cellular.1"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
codegen-units = 1
lto = true
opt-level = 's'

[profile.release]
codegen-units = 1
lto = true
opt-level = 'z'
panic = "abort"
strip = "symbols"


[dependencies]
anyhow = "1.0"
async-trait = "0.1.92"
fastrand = "2"
garde = { version = "0.23", default-features = false, features = ["derive"] }
icmp-socket2 = { version = "0.6.6", features = ["tokio"] }
irtt-client = { version = "0.8.0", optional = true, features = ["ancillary", "tokio"] }
libc = "0.2"
mlua = { version = "0.12", features = ["lua51", "send", "serde"], optional = true }
rustix = { version = "1.1", features = ["fs", "system", "thread", "time"] }
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2.0"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"], optional = true }
tokio = { version = "1", features = ["full"] }

[dependencies.log]
features = ["std"]
version = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
netlink-bindings = { version = "0.3.5", features = ["rt-link", "tc"] }
netlink-socket2 = { version = "0.3.5" }

[target.'cfg(unix)'.dependencies]
tokio-ubus = { git = "https://github.com/Lochnair/tokio-ubus", rev = "cc6faef809a92fd80a76d0d6897773811b61e4a2", optional = true }

[features]
default = ["irtt", "lua-vendored", "toml", "ubus"]
irtt = ["dep:irtt-client"]
lua = ["dep:mlua"]
lua-vendored = ["lua", "mlua/vendored"]
toml = ["dep:toml"]
ubus = ["dep:tokio-ubus"]

[workspace]
resolver = "3"
